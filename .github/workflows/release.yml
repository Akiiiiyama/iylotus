name: Release

# A cada push na main: se houver changesets, abre um PR "Version packages".
# Quando esse PR é aprovado e entra na main, publica no npm os pacotes com versão nova.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      # Sem o segredo NPM_TOKEN no repositório, o fluxo só testa e não tenta publicar.
      - name: Check npm token
        id: npm
        run: echo "ready=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.npm.outputs.ready == 'true'
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: Version packages
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
